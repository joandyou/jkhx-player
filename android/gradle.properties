# Giới hạn RAM và tối ưu JVM cho Gradle Daemon
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=300000
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.vfs.watch=false

# Giới hạn RAM cho Kotlin Daemon
kotlin.daemon.jvmargs=-Xmx1536m -XX:+UseSerialGC

# Cấu hình mặc định cho Android & Kotlin
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
